# Render Blueprint — deploy backend + frontend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: askmydocs-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: askmydocs-frontend
    runtime: node
    rootDir: lovable_frontend
    buildCommand: npm install && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: askmydocs-api
          property: url
